<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video - Al Mehdaviat Network</title>
  <link rel="stylesheet" href="css/style.css">
  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-BGJDWPW468"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-BGJDWPW468');
  </script>
  <style>
    body { background: var(--bg-primary); }
    .player-page {
      margin-top: 72px;
      min-height: calc(100vh - 72px);
      padding: 2rem;
      max-width: 1000px;
      margin-left: auto;
      margin-right: auto;
    }
    .player-back {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--gold);
      text-decoration: none;
      font-weight: 600;
      font-size: 0.9rem;
      margin-bottom: 1.5rem;
      transition: opacity 0.3s;
    }
    .player-back:hover { opacity: 0.7; }
    .player-embed {
      width: 100%;
      aspect-ratio: 16/9;
      border: none;
      border-radius: 16px;
      background: #000;
    }
    .player-title {
      font-family: 'Playfair Display', serif;
      font-size: 1.4rem;
      font-weight: 800;
      color: var(--text-primary);
      margin-top: 1.2rem;
      line-height: 1.4;
    }
    .player-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 1rem;
      color: var(--red-light);
      text-decoration: none;
      font-weight: 600;
      font-size: 0.85rem;
      transition: opacity 0.3s;
    }
    .player-link:hover { opacity: 0.7; }
    @media (max-width: 768px) {
      .player-page { padding: 1rem; }
      .player-title { font-size: 1.1rem; }
    }
  </style>
</head>
<body>

  <nav class="navbar">
    <a href="index.html" class="nav-brand">
      <img src="assets/logo.png" alt="Logo" class="nav-logo-img">
      <span class="nav-title">Al Mehdaviat Network</span>
    </a>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="live.html">Live</a></li>
    </ul>
    <button class="mobile-menu-btn">☰</button>
  </nav>

  <div class="player-page">
    <a href="index.html" class="player-back">← Back to Home</a>
    <div id="playerContainer">
      <div class="loading">
        <div class="loading-spinner"></div>
        <div class="loading-text">Loading video...</div>
      </div>
    </div>
  </div>

  <footer class="footer">
    <div class="footer-brand">
      <img src="assets/logo.png" alt="Logo" class="footer-logo">
      <span>Al Mehdaviat Network</span>
    </div>
    <div class="footer-links">
      <a href="index.html">Home</a>
      <a href="live.html">Live</a>
      <a href="https://www.youtube.com/@AlMehdaviat" target="_blank">YouTube</a>
    </div>
    <div class="footer-divider"></div>
    <p class="footer-bottom">© 2026 Al Mehdaviat Network | Made with <span class="heart">♥</span> for Mola Hussain (AS)</p>
  </footer>

  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async function() {
      var container = document.getElementById('playerContainer');
      var params = new URLSearchParams(window.location.search);
      var videoId = params.get('id');

      if (!videoId) {
        container.innerHTML = '<div class="empty-state"><div class="icon">📺</div><p>No video specified</p></div>';
        return;
      }

      var title = '';
      try {
        var resp = await fetch('https://www.youtube.com/oembed?url=https://www.youtube.com/watch?v=' + videoId + '&format=json');
        if (resp.ok) {
          var oembed = await resp.json();
          title = oembed.title || '';
        }
      } catch(e) {}

      document.title = (title || 'Video') + ' - Al Mehdaviat Network';

      container.innerHTML =
        '<iframe class="player-embed" src="https://www.youtube.com/embed/' + videoId + '?autoplay=1" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>' +
        (title ? '<h1 class="player-title">' + title + '</h1>' : '') +
        '<a href="https://www.youtube.com/watch?v=' + videoId + '" target="_blank" class="player-link">📺 Watch on YouTube</a>';
    });
  </script>
</body>
</html>
