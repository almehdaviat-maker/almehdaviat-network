  <style>
    .live-page {
      margin-top: 72px;
      min-height: calc(100vh - 72px);
      display: block;
      padding: 2rem 1rem;
      width: 100%;
      box-sizing: border-box;
      text-align: center;
    }
    .live-state {
      display: block;
      width: 100%;
      max-width: 1280px;
      margin: 0 auto;
      padding: 0;
      box-sizing: border-box;
      text-align: center;
    }
    .live-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 20px;
      border-radius: 20px;
      background: rgba(192, 57, 43, 0.15);
      color: #e74c3c;
      font-size: 0.85rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 1.5rem;
    }
    .live-badge::before {
      content: '';
      width: 8px;
      height: 8px;
      background: #c0392b;
      border-radius: 50%;
      animation: livePulse 1.5s infinite;
    }
    @keyframes livePulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
    .live-embed {
      display: block;
      width: 100%;
      max-width: 1280px;
      margin: 0 auto;
      padding: 0;
      position: relative;
      z-index: 1;
    }
    .live-embed iframe {
      display: block !important;
      width: 100% !important;
      max-width: 1280px !important;
      height: auto !important;
      aspect-ratio: 16 / 9 !important;
      border: none !important;
      border-radius: 16px !important;
      background: #000 !important;
      margin: 0 auto !important;
    }
    .live-title {
      font-weight: 700;
      color: #f5efe6;
      margin-top: 1rem;
      font-size: 1.1rem;
      max-width: 1280px;
      margin-left: auto;
      margin-right: auto;
    }
    .not-live-icon {
      font-size: 4rem;
      margin-bottom: 1rem;
      opacity: 0.5;
      max-width: 600px;
      margin-left: auto;
      margin-right: auto;
    }
    .not-live-title {
      font-family: 'Playfair Display', serif;
      font-size: 1.8rem;
      font-weight: 800;
      color: #f5efe6;
      margin-bottom: 0.5rem;
      max-width: 600px;
      margin-left: auto;
      margin-right: auto;
    }
    .not-live-sub {
      color: #5a5a72;
      font-size: 1rem;
      margin-bottom: 2rem;
      max-width: 600px;
      margin-left: auto;
      margin-right: auto;
    }
    .yt-btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 16px 36px;
      border-radius: 14px;
      background: linear-gradient(135deg, #8b1a10, #c0392b);
      color: #fff;
      text-decoration: none;
      font-weight: 700;
      font-size: 1rem;
      transition: all 0.3s;
      box-shadow: 0 4px 20px rgba(192, 57, 43, 0.3);
    }
    .yt-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 30px rgba(192, 57, 43, 0.5);
    }
    .refresh-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 24px;
      border-radius: 12px;
      background: rgba(212,168,67,0.15);
      border: 1px solid rgba(212,168,67,0.4);
      color: #d4a843;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      margin-top: 1.5rem;
      transition: all 0.3s;
    }
    .refresh-btn:hover { background: rgba(212,168,67,0.3); }
    .api-error {
      color: #e74c3c;
      font-size: 0.85rem;
      margin-top: 1rem;
      padding: 8px 16px;
      background: rgba(192,57,43,0.1);
      border-radius: 8px;
      border: 1px solid rgba(192,57,43,0.3);
      max-width: 600px;
      margin-left: auto;
      margin-right: auto;
    }
    @media (max-width: 768px) {
      .live-page { padding: 1rem 0.5rem; }
    }
  </style>
</head>
<body>

  <nav class="navbar">
    <a href="index.html" class="nav-brand">

    </ul>
    <button class="mobile-menu-btn">☰</button>

  <div class="live-page">
    <div class="live-state" id="liveState">
      <div class="loading">
        <div class="loading-spinner"></div>
        <div class="loading-text">Checking live status...</div>
      </div>
    </div>
  </div>

  <footer class="footer">
    <div class="footer-brand">
      <img src="assets/logo.png" alt="Logo" class="footer-logo">
      <span>Al Mehdaviat Network</span>
    </div>
    <div class="footer-links">
      <a href="index.html">Home</a>
      <a href="live.html">Live</a>
      <a href="https://www.youtube.com/@AlMehdaviat" target="_blank">YouTube</a>
    </div>
    <div class="footer-divider"></div>
    <p class="footer-bottom">© 2026 Al Mehdaviat Network | Made with <span class="heart">♥</span> for Mola Hussain (AS)</p>
  </footer>

  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script>
    function showNotLive() {
      var state = document.getElementById('liveState');
      state.innerHTML =
        '<div class="not-live-icon">🔴</div>' +
        '<div class="not-live-title">No Live Stream Right Now</div>' +
        '<div class="not-live-sub">Visit our YouTube channel for previous live streams and recordings.</div>' +
        '<a href="https://www.youtube.com/@AlMehdaviat/streams" target="_blank" class="yt-btn">📺 Visit YouTube for Live Streams</a>' +
        '<br><button class="refresh-btn" onclick="checkLive()">🔄 Check Again</button>';
    }

    function showLive(live) {
      var state = document.getElementById('liveState');
      state.innerHTML =
        '<div class="live-badge">LIVE NOW</div>' +
        '<div class="live-embed"><iframe id="liveIframe" src="' + live.embedUrl + '?autoplay=1" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe></div>' +
        '<div class="live-title">' + live.title + '</div>' +
        '<button class="refresh-btn" onclick="checkLive()">🔄 Refresh Status</button>';

      // Force iframe size via JS
      var iframe = document.getElementById('liveIframe');
      if (iframe) {
        iframe.style.display = 'block';
        iframe.style.width = '100%';
        iframe.style.maxWidth = '1280px';
        iframe.style.height = 'auto';
        iframe.style.aspectRatio = '16 / 9';
        iframe.style.border = 'none';
        iframe.style.borderRadius = '16px';
        iframe.style.background = '#000';
        iframe.style.margin = '0 auto';
      }
    }

    async function checkLive() {
      var state = document.getElementById('liveState');
      state.innerHTML =
        '<div class="loading">' +
        '<div class="loading-spinner"></div>' +
        '<div class="loading-text">Checking live status...</div>' +
        '</div>';

      // Force fresh check - clear cache
      try { localStorage.removeItem('yt_cache_live'); } catch(e) {}

      try {
        var live = await YouTubeAPI.checkLiveNow();
        if (live) {
          showLive(live);
        } else {
          showNotLive();
        }
      } catch(e) {
        showNotLive();
      }
    }

    document.addEventListener('DOMContentLoaded', function() {
      checkLive();
      // Auto-refresh every 60 seconds
      setInterval(checkLive, 60000);
    });
  </script>
</body>
